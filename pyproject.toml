[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growthaudit"
version = "0.1.0"
description = "Free, open-source website auditor for SEO, performance, security, and technical health — no paywall."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ashrafwebdev" }]
keywords = ["seo", "web-audit", "performance", "accessibility", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "rich>=13.7",
    "jinja2>=3.1",
    "protego>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
growthaudit = "growthaudit.cli:app"

[project.urls]
Homepage = "https://github.com/ashrafwebdev/website-growth-auditor"
Issues = "https://github.com/ashrafwebdev/website-growth-auditor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/growthaudit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: typer's `= typer.Option(...)` / `typer.Argument(...)` default pattern is idiomatic.
ignore = ["B008"]
